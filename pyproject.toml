[project]
name = "privacy-proxy"
version = "0.1.3"
description = "Inspects every request to a cloud model API and stops phone numbers, national IDs and other private data from leaving"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "httpx>=0.28,<1",
    "phonenumbers>=9",
    "presidio-analyzer>=2.2.365",
    "pypdf>=6.21",
    "pyyaml>=6",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
privacy-proxy = "privacy_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_proxy"]

# The prices and upstreams the API lane reads, packed beside the code in a wheel.
[tool.hatch.build.targets.wheel.force-include]
"providers.yaml" = "privacy_proxy/providers.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
