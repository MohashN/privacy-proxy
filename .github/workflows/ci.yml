name: CI

# Lint, test and scan for secrets. Runs on GitHub-hosted runners by default; a
# repo that can't use them sets the repo variable RUNS_ON to a JSON runner
# label list, e.g. ["self-hosted","linux"].
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # The floor pyproject declares (`requires-python = ">=3.11"`), and
          # therefore the version worth testing.
          python-version: "3.11"
          enable-cache: true

      # --locked: install exactly what uv.lock pins, and fail if pyproject.toml
      # has drifted from it. It also pins ruff, so a linter bump is a lockfile
      # diff rather than a surprise red build.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, not just the tip: a secret removed later is still leaked.
          fetch-depth: 0
          persist-credentials: false

      # The free CLI, not gitleaks-action (which needs a licence on organisation
      # accounts). Pinned release, verified against the sha256 from its checksums file.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: gitleaks
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
